<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search - StudyHive</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="image-search.css">
</head>
<body>
    <header>
        <a class="brand" href="index.html"><strong>StudyHive</strong></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="subjects.html">Dashboard</a>
            <a href="chat.html">Live Chat</a>
            <a href="image-search.html" class="active">Image Search</a>
            <a href="profile.html">Profile</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="hero hero-search">
            <div>
                <h1>Find Study Resources</h1>
                <p>Search for high-quality images to use in your study materials, presentations, and notes.</p>
            </div>
        </section>

        <section class="search-container">
            <form id="imageSearchForm" class="search-form">
                <div class="search-input-group">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for images (e.g., biology, calculus, history)..." 
                        required
                    >
                    <button type="submit" class="search-btn">Search</button>
                </div>
                <div class="search-options">
                    <label>
                        <input type="checkbox" id="colorFilter"> Show color filter
                    </label>
                    <label>
                        <input type="checkbox" id="orientationFilter"> Show orientation filter
                    </label>
                </div>
            </form>

            <div id="filterOptions" class="filter-options" style="display: none;">
                <div class="filter-group">
                    <label for="colorSelect">Color:</label>
                    <select id="colorSelect">
                        <option value="">Any Color</option>
                        <option value="black_and_white">Black & White</option>
                        <option value="black">Black</option>
                        <option value="white">White</option>
                        <option value="yellow">Yellow</option>
                        <option value="orange">Orange</option>
                        <option value="red">Red</option>
                        <option value="purple">Purple</option>
                        <option value="green">Green</option>
                        <option value="blue">Blue</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="orientationSelect">Orientation:</label>
                    <select id="orientationSelect">
                        <option value="">Any Orientation</option>
                        <option value="landscape">Landscape</option>
                        <option value="portrait">Portrait</option>
                        <option value="squarish">Square</option>
                    </select>
                </div>
            </div>

            <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>Searching for images...</p>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div id="imageGrid" class="image-grid"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="image-search.js"></script>
</body>
</html>
